# Server Configuration
server.port=8085
spring.application.name=payment-service

# MongoDB Configuration
spring.data.mongodb.uri=mongodb://admin:password@localhost:27017/rescuebite_payment_db?authSource=admin
spring.data.mongodb.auto-index-creation=true

# External Microservice URLs
services.order-service.url=http://localhost:8084
services.notification-service.url=http://localhost:8086

# Springdoc OpenAPI / Swagger Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

